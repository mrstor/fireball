<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fireball Race: a couch racing game for up to four players. Bump your friends off the track.">
<meta name="theme-color" content="#cfeaff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='24' fill='%23ff7a1a' stroke='%2322204a' stroke-width='4'/%3E%3Ccircle cx='24' cy='32' r='6' fill='white'/%3E%3Ccircle cx='40' cy='32' r='6' fill='white'/%3E%3Ccircle cx='25' cy='33' r='3' fill='%2322204a'/%3E%3Ccircle cx='41' cy='33' r='3' fill='%2322204a'/%3E%3Cpath d='M26 6c6 6 2 8 6 12 2-6 8-6 6-12' fill='%23ffd23f' stroke='%2322204a' stroke-width='3'/%3E%3C/svg%3E">
<title>Fireball Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: a full-screen couch racing game. The 3D race fills the window and splits into one view per player; menus are white ink-outlined stickers floating over a live attract race. One bright cartoon look on purpose (the Fireball kit), so no dark theme. */
:root{
  --sky:#cfeaff;
  --paper:#ffffff;
  --ink:#22204a;
  --ink-soft:#4d4b7a;
  --sun:#ffc928;
  --red:#ff4b3e;
  --p1:#ff4b3e;--p2:#2ea7ff;--p3:#35c46a;--p4:#ffb400;
  --display:"Lilita One","Arial Black",Impact,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --o:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#1d1b40;color:var(--ink);overflow:hidden}
body{font:600 16px/1.5 var(--body)}
.wrap{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{position:relative;width:100%;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;outline:none}
.app canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.views{position:absolute;inset:0;pointer-events:none}
.view{position:absolute;color:#fff;overflow:hidden}
.view+.view{box-shadow:inset 0 0 0 2px var(--ink)}
.vtag{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:8px}
.vface{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.92);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.vname{font:900 13px/1 var(--body);color:#fff;background:var(--pc);border:2.5px solid var(--ink);border-radius:999px;padding:5px 10px;text-shadow:0 1px 0 var(--ink)}
.vpos{position:absolute;right:12px;top:6px;text-align:right;font:400 52px/1 var(--display);color:var(--sun);text-shadow:var(--o),0 4px 0 var(--ink)}
.vpos sup{font-size:.42em;vertical-align:top;margin-left:2px}
.vlap{display:block;font:400 18px/1 var(--display);color:#fff;margin-top:4px}
.vbump{position:absolute;right:12px;bottom:12px;width:86px;height:30px;border:3px solid var(--ink);border-radius:999px;background:rgba(255,255,255,.85);overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.vbump i{position:absolute;left:0;top:0;bottom:0;background:var(--pc)}
.vbump span{position:absolute;inset:0;display:grid;place-items:center;font:900 12px/1 var(--body);color:var(--ink);letter-spacing:.06em}
.vbump.ready{animation:rdy .6s ease-in-out infinite alternate}
@keyframes rdy{to{transform:scale(1.06)}}
.vko{position:absolute;left:12px;bottom:12px;font:400 20px/1 var(--display);text-shadow:var(--o),0 3px 0 var(--ink)}
.vko small{font:900 11px/1 var(--body);letter-spacing:.08em;margin-left:4px}
.vpop{position:absolute;left:0;right:0;top:26%;display:grid;justify-items:center;text-align:center}
.pop{font:400 clamp(22px,3.6vw,44px)/1 var(--display);color:var(--sun);text-shadow:var(--o),0 4px 0 var(--ink);animation:pop 1.3s ease-out forwards;padding-inline:8px}
.pop.red{color:#ff8a7f}.pop.blue{color:#8fe3ff}.pop.green{color:#a8f08a}.pop.pink{color:#ff9cf0}
.pop small{display:block;font:900 14px/1.3 var(--body);color:#fff}
@keyframes pop{0%{transform:scale(.3) rotate(-6deg);opacity:0}14%{transform:scale(1.12) rotate(2deg);opacity:1}28%{transform:scale(1) rotate(-1deg)}80%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.view.small .vface{width:42px;height:42px}.view.small .vpos{font-size:38px}.view.small .vbump{width:70px;height:26px}
.view.done .vbump{display:none}
.big{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:400 clamp(70px,16vw,190px)/1 var(--display);color:var(--sun);text-shadow:4px 0 0 var(--ink),-4px 0 0 var(--ink),0 4px 0 var(--ink),0 -4px 0 var(--ink),0 10px 0 var(--ink)}
.big span{animation:cnt .9s ease-out forwards}
@keyframes cnt{0%{transform:scale(2.2);opacity:0}20%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.85);opacity:0}}
.feed{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none;width:min(520px,90%)}
.feed div{font:900 14px/1.2 var(--body);background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 var(--ink);animation:feed 3.2s ease-out forwards;text-align:center}
.feed b{color:var(--red)}
@keyframes feed{0%{transform:translateY(-12px);opacity:0}8%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}
.mm{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:132px;height:132px;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(34,32,74,.7))}
.mm canvas{width:100%;height:100%;display:block}
.app.p1 .mm{left:auto;right:12px;bottom:56px;transform:none}
.app.touchmode .vko,.app.touchmode .vbump{bottom:112px}
.app.touchmode.p1 .mm{bottom:150px;width:96px;height:96px}
.topbtns{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:3}
.app.racing .topbtns{top:auto;bottom:10px;right:auto;left:50%;transform:translateX(-50%) translateY(0);opacity:0;transition:opacity .2s}
.app.racing .topbtns:hover,.app.racing .topbtns:focus-within{opacity:1}
.ibtn{all:unset;box-sizing:border-box;cursor:pointer;font:900 13px/1 var(--body);color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:7px 12px;box-shadow:0 3px 0 var(--ink)}
.ibtn:focus-visible{outline:3px solid var(--red);outline-offset:2px}

.ov{position:absolute;inset:0;display:grid;place-items:center;padding:14px;z-index:4;overflow:auto;background:rgba(34,32,74,.28)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink);padding:16px 18px;width:min(980px,100%);display:grid;gap:14px;max-height:100%;overflow:auto}
.lob-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 20px}
.logo{margin:0;font:400 clamp(44px,7vw,78px)/.9 var(--display);letter-spacing:.02em;color:var(--sun);
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 8px 0 var(--red),0 11px 0 var(--ink)}
.logo small{display:block;font-size:.4em;line-height:1;color:#fff;margin-top:12px;letter-spacing:.12em}
.sub{margin:0;font:800 16px/1.4 var(--body);color:var(--ink-soft);max-width:44ch}
.lbl{font:900 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.slot{border:3px solid var(--ink);border-radius:18px;padding:30px 10px 12px;display:grid;gap:6px;justify-items:center;align-content:start;text-align:center;background:var(--sky);min-width:0;position:relative}
.slot.on{background:#fff;box-shadow:inset 0 -6px 0 var(--pc)}
.slot .ptag{position:absolute;left:8px;top:8px;font:900 12px/1 var(--body);color:#fff;background:var(--pc);border:2.5px solid var(--ink);border-radius:999px;padding:4px 9px}
.slot canvas{width:96px;height:96px}
.pick{display:flex;align-items:center;gap:6px}
.pick b{font:400 22px/1 var(--display);min-width:4.2em}
.arr{all:unset;box-sizing:border-box;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:50%;background:var(--sun);font:900 14px/1 var(--body)}
.arr:focus-visible,.x:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.scheme{font:800 12px/1.35 var(--body);color:var(--ink-soft)}
.x{all:unset;cursor:pointer;position:absolute;right:8px;top:8px;width:24px;height:24px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:#fff;font:900 12px/1 var(--body)}
.join{display:grid;gap:8px;place-items:center;align-content:center;min-height:160px;font:800 14px/1.35 var(--body);color:var(--ink-soft)}
.join kbd,.help kbd{font:900 12px var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-bottom-width:4px;border-radius:7px;padding:0 6px}
.add{all:unset;cursor:pointer;font:900 13px/1 var(--body);color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:7px 12px;box-shadow:0 3px 0 var(--ink)}
.add:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trk{all:unset;box-sizing:border-box;cursor:pointer;border:3px solid var(--ink);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;gap:8px;padding:4px 10px 4px 4px;background:var(--bg)}
.trk canvas{width:62px;height:62px;display:block}
.trk b{display:block;font:400 18px/1.05 var(--display);color:#fff;text-shadow:var(--o)}
.trk small{font:900 11px/1.2 var(--body);color:#fff;text-shadow:0 1px 0 var(--ink)}
.trk[aria-pressed="true"]{box-shadow:0 0 0 4px var(--sun),0 4px 0 var(--ink);transform:translateY(-2px)}
.trk:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.opts{display:grid;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;box-sizing:border-box;cursor:pointer;font:900 13px/1 var(--body);padding:8px 12px;border:2.5px solid var(--ink);border-radius:999px;background:#fff}
.chip[aria-pressed="true"]{background:var(--sun)}
.chip:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.go{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font:400 34px/1 var(--display);letter-spacing:.04em;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:18px;padding:14px 20px;box-shadow:0 6px 0 var(--ink);transition:transform .1s}
.go:hover{transform:translateY(-2px) rotate(-1deg)}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.go:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.help{margin:0;font:700 13px/1.9 var(--body);color:var(--ink-soft);text-align:center}
.res{width:min(620px,100%)}
.res h2{margin:0;font:400 clamp(30px,5vw,48px)/1 var(--display);text-align:center}
.rlist{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:2.2rem 40px minmax(0,1fr) auto auto;align-items:center;gap:10px;border:2.5px solid var(--ink);border-radius:14px;padding:4px 12px;background:var(--sky);font-weight:800}
.rrow.me{background:#fff;box-shadow:inset 6px 0 0 var(--pc)}
.rrow.first{background:#fff3c4}
.rrow b{font:400 26px/1 var(--display)}
.rrow canvas{width:40px;height:40px}
.rrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .nm em{font-style:normal;font:900 11px/1 var(--body);color:#fff;background:var(--pc);border:2px solid var(--ink);border-radius:999px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.rrow .st{font:800 13px/1.2 var(--body);color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font:400 20px/1 var(--display);color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:11px 16px;box-shadow:0 4px 0 var(--ink)}
.btn.pri{background:var(--sun)}
.btn:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.touch{position:absolute;inset:auto 0 0 0;height:150px;pointer-events:none;z-index:2}
.tb{position:absolute;bottom:18px;pointer-events:auto;width:76px;height:76px;border-radius:50%;border:3px solid var(--ink);background:rgba(255,255,255,.82);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;font:400 18px/1 var(--display);color:var(--ink);touch-action:none}
.tb.on{background:var(--sun);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tl{left:16px}.tr{left:104px}.tj{right:104px}.tbm{right:16px;background:rgba(255,230,140,.92)}
.msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#2b2766;color:#fff;font:400 26px var(--display);z-index:6}
@media (max-width:760px){
  .slots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row2{grid-template-columns:minmax(0,1fr)}
  .tracks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vpos{font-size:40px}
  .mm{width:96px;height:96px}
}
@media (prefers-reduced-motion:reduce){.pop,.big span,.feed div{animation-duration:.01s}.vbump.ready{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="app" id="app" tabindex="0" aria-label="Fireball Race">
  <canvas id="gl"></canvas>
  <div class="views" id="views"></div>
  <div class="big" id="big"></div>
  <div class="feed" id="feed" aria-live="polite"></div>
  <div class="mm" id="mm"><canvas id="mmCv" width="264" height="264"></canvas></div>
  <div class="topbtns">
    <button class="ibtn" id="bSound" type="button">Sound on</button>
    <button class="ibtn" id="bPause" type="button">Pause</button>
  </div>
  <div class="touch" id="touch" hidden>
    <div class="tb tl" data-k="l">◀</div><div class="tb tr" data-k="r">▶</div>
    <div class="tb tj" data-k="j">JUMP</div><div class="tb tbm" data-k="b">BUMP</div>
  </div>

  <div class="ov" id="lobby">
    <div class="card">
      <div class="lob-head">
        <h1 class="logo">FIREBALL<small>Race</small></h1>
        <p class="sub">Up to four players on one screen. Steer, jump and <b>bump</b> your friends off the track. No guard rails in the danger zones.</p>
      </div>
      <div>
        <p class="lbl">Who's racing?</p>
        <div class="slots" id="slots"></div>
      </div>
      <div class="row2">
        <div><p class="lbl">Track</p><div class="tracks" id="tracks"></div></div>
        <div class="opts">
          <div><p class="lbl">Laps</p><div class="chips" id="laps"></div></div>
          <div><p class="lbl">Steering</p><div class="chips" id="steerOpt"></div></div>
          <div><p class="lbl">Ghost DJ</p><div class="chips" id="ghostOpt"></div></div>
          <button class="go" id="goBtn" type="button">RACE!</button>
        </div>
      </div>
      <p class="help" id="help"></p>
    </div>
  </div>

  <div class="ov" id="results" hidden>
    <div class="card res">
      <h2 id="resTitle">Finished!</h2>
      <div class="rlist" id="resList"></div>
      <div class="btns"><button class="btn pri" id="rAgain" type="button">Race again</button><button class="btn" id="rNext" type="button">Next track</button><button class="btn" id="rLobby" type="button">Change racers</button></div>
    </div>
  </div>

  <div class="ov" id="pauseOv" hidden>
    <div class="card res">
      <h2>Paused</h2>
      <div class="btns"><button class="btn pri" id="pResume" type="button">Keep racing</button><button class="btn" id="pRestart" type="button">Restart</button><button class="btn" id="pLobby" type="button">Back to menu</button></div>
    </div>
  </div>
  <div class="msg" id="loading">Building the tracks…</div>
  <div class="msg" id="noGL" hidden>This needs WebGL. Try a recent Chrome, Safari or Firefox.</div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { $('noGL').hidden = false; $('loading').hidden = true; return; }
const T = THREE;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const sm = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const hexA = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixHex = (a, b, t) => { const x = hexA(a), y = hexA(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const ord = n => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
const INK = '#22204a';
const R = 0.45, GRAV = 26, VBASE = 22, NRACERS = 6;
let BUMPK = 8.5, LATK = 1.1;
const PCOL = ['#ff4b3e', '#2ea7ff', '#35c46a', '#ffb400'];

// ---------- shared with the game: critters and faces ----------
const CRIT = [
  { name: 'Blaze', col: '#ff7a1a', acc: 'flame', emblem: 'flame', line: 'Hothead. First off the line, first to complain.' },
  { name: 'Kai', col: '#3ad6ff', acc: 'cat', emblem: 'bolt', line: 'Cool and smug. Lives for a clean overtake.' },
  { name: 'Noor', col: '#ff5fc8', acc: 'bunny', emblem: 'heart', line: 'Sweet as sugar, until you bump her.' },
  { name: 'Zeb', col: '#8fe04a', acc: 'antenna', emblem: 'spots', line: 'Jittery bug. Panics near every edge.' },
  { name: 'Miko', col: '#8a6bff', acc: 'horns', emblem: 'star', line: 'Pure chaos. Saves rockets for friends.' },
  { name: 'Lou', col: '#ffcf3a', acc: 'leaf', emblem: 'stripes', line: 'Easygoing. Rolls with whatever happens.' },
];

// ---------- faces (2D, shared by 3D textures, HUD and cards) ----------
const EXPR = {
  happy: { eyes: 'normal', mouth: 'smile', blush: 1 }, focus: { eyes: 'half', brows: 'angry', mouth: 'flat' },
  worried: { eyes: 'small', brows: 'worried', mouth: 'wavy', sweat: 1 }, dizzy: { eyes: 'spiral', mouth: 'wavy' },
  angry: { eyes: 'normal', brows: 'angry', mouth: 'teeth', anger: 1 }, scream: { eyes: 'wide', brows: 'worried', mouth: 'scream' },
  wow: { eyes: 'wide', mouth: 'o', blush: 1 }, cheer: { eyes: 'happy', mouth: 'grin', blush: 1 }, smug: { eyes: 'half', brows: 'smug', mouth: 'smirk' },
  starry: { eyes: 'star', mouth: 'grin', blush: 1 },
};
function drawFace(g, cx, cy, k, ex, body, lx = 0, ly = 0, blink = false) {
  const e = EXPR[ex] || EXPR.happy;
  g.save(); g.translate(cx, cy); g.scale(k, k); g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = INK; g.lineWidth = 6;
  let et = e.eyes; if (blink && (et === 'normal' || et === 'small' || et === 'wide' || et === 'half')) et = 'closed';
  for (const sd of [-1, 1]) {
    const x0 = sd * 42, y0 = -8;
    if (et === 'normal' || et === 'small' || et === 'wide' || et === 'half') {
      const r = et === 'wide' ? 31 : 27, pr = (et === 'small' || et === 'wide') ? 8 : 13;
      g.fillStyle = '#fff'; g.beginPath(); g.arc(x0, y0, r, 0, 7); g.fill();
      const px = x0 + lx * (r - pr - 4), py = y0 + 3 + ly * (r - pr - 6);
      g.fillStyle = INK; g.beginPath(); g.arc(px, py, pr, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(px - pr * 0.35, py - pr * 0.4, Math.max(2.5, pr * 0.35), 0, 7); g.fill();
      if (et === 'half') {
        g.fillStyle = body; g.beginPath(); g.rect(x0 - r - 5, y0 - r - 5, 2 * r + 10, r + 3); g.fill();

      const a = document.createElement('button'); a.type = 'button'; a.className = 'arr'; a.textContent = '◀'; a.setAttribute('aria-label', 'Previous critter for player ' + (i + 1)); a.onclick = () => cycleCrit(i, -1);
      const nm = document.createElement('b'); nm.textContent = CRIT[sl.crit].name;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'arr'; b.textContent = '▶'; b.setAttribute('aria-label', 'Next critter for player ' + (i + 1)); b.onclick = () => cycleCrit(i, 1);
      pk.append(a, nm, b); d.appendChild(pk);
      const sc = document.createElement('span'); sc.className = 'scheme'; sc.textContent = SCHEMES[sl.scheme].label; d.appendChild(sc);
      if (i > 0) { const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label', 'Remove player ' + (i + 1)); x.onclick = () => { S.slots.splice(i, 1); if (S.slots.length === 1 && (S.slots[0].scheme === 'wasd' || S.slots[0].scheme === 'arrows')) S.slots[0].scheme = 'keys'; renderLobby(); }; d.appendChild(x); }
    } else {
      const j = document.createElement('div'); j.className = 'join';
      j.innerHTML = i === S.slots.length ? '<p style="margin:0">Press <kbd>↑</kbd> or <kbd>I</kbd><br>or <b>A</b> on a gamepad<br>to join</p>' : '<p style="margin:0">Free spot</p>';
      if (i === S.slots.length) { const add = document.createElement('button'); add.type = 'button'; add.className = 'add'; add.textContent = '+ Add player'; add.onclick = () => { const sc = nextFreeScheme(); if (sc) joinSlot(sc); }; j.appendChild(add); }
      d.appendChild(j);
    }
    box.appendChild(d);
  }
  const tb = $('tracks'); tb.textContent = '';
  TRACKS.forEach((tr, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'trk'; b.setAttribute('aria-pressed', String(S.track === i)); b.style.setProperty('--bg', LOOKS[tr.look].card);
    const cv = document.createElement('canvas'); cv.width = cv.height = 124; drawThumb(cv, i);
    const tx = document.createElement('span'); const nm = document.createElement('b'); nm.textContent = tr.name; const sm2 = document.createElement('small'); sm2.textContent = TRACK_BLURB[i]; tx.append(nm, sm2);
    b.append(cv, tx); b.onclick = () => { S.track = i; renderLobby(); S.attractTrack = i; setupAttract(); if (AU.on) setSong(TRK.look.song); }; tb.appendChild(b);
  });
  const lp = $('laps'); lp.textContent = '';
  for (const n of [2, 3, 5]) { const c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.textContent = n + ' laps'; c.setAttribute('aria-pressed', String(S.laps === n)); c.onclick = () => { S.laps = n; saveOpts(); renderLobby(); }; lp.appendChild(c); }
  const st = $('steerOpt'); st.textContent = '';
  for (const [v, t] of [[true, 'Lanes'], [false, 'Free']]) { const c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.textContent = t; c.setAttribute('aria-pressed', String(S.lanes === v)); c.onclick = () => { S.lanes = v; saveOpts(); renderLobby(); }; st.appendChild(c); }
  const go = $('ghostOpt'); go.textContent = '';
  for (const [v, t] of [[true, 'On'], [false, 'Off']]) { const c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.textContent = t; c.setAttribute('aria-pressed', String(S.ghostOn === v)); c.onclick = () => { S.ghostOn = v; saveOpts(); renderLobby(); }; go.appendChild(c); }
  const touchHelp = S.lanes ? 'Swipe left or right to switch lanes, swipe up to jump, tap to <b>bump</b> the critter next to you. The buttons work too.' : 'Hold <b>◀ ▶</b> to steer, tap <b>JUMP</b>, tap <b>BUMP</b> to shove the critter next to you.';
  const keyHelp = (S.lanes ? 'Left/right hops a lane · <b>bump</b> shoves the critter next to you a lane over, off the track from the edge lane' : 'Steer freely · <b>bump</b> dashes sideways and shoves whoever you hit') + ' · <b>jump</b> over trouble · <kbd>Enter</kbd> to start · <kbd>Esc</kbd> pause · <kbd>M</kbd> sound';
  $('help').innerHTML = COARSE && S.slots.length === 1 ? touchHelp : keyHelp;
}
function drawThumb(cv, ti) {
  const tr = TRACKS[ti], sh = tr.shape, g = cv.getContext('2d'), pts = [];
  for (let i = 0; i < 90; i++) { const th = i / 90 * Math.PI * 2, r = sh.R0 + sh.A1 * Math.sin(th * 2 + sh.P1) + sh.A2 * Math.sin(th * 3 + sh.P2); pts.push([Math.cos(th) * r * sh.sx, -Math.sin(th) * r]); }
  let m = 0; for (const [x, z] of pts) m = Math.max(m, Math.abs(x), Math.abs(z)); const sc = 50 / m;
  g.lineJoin = 'round'; g.beginPath(); pts.forEach(([x, z], i) => { const X = 62 + x * sc, Y = 62 + z * sc; i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); g.closePath();
  g.strokeStyle = INK; g.lineWidth = 13; g.stroke(); g.strokeStyle = '#ffffff'; g.lineWidth = 7; g.stroke();
}
function animLobby() {
  for (const d of document.querySelectorAll('.slot.on')) { if (!d._cv) continue; const g = d._cv.getContext('2d'); g.clearRect(0, 0, 192, 192); drawCritter2D(g, 96, 92, 62, CRIT[d._ci], Math.sin(S.t * 0.7 + d._ci) > 0.6 ? 'cheer' : 'happy', { t: S.t, sq: Math.max(0, Math.sin(S.t * 5 + d._ci)) * 0.06, blink: (S.t * 0.4 + d._ci * 0.37) % 3 < 0.06 }); }
}
$('goBtn').addEventListener('click', () => startRace());
$('rAgain').addEventListener('click', () => startRace());
$('rNext').addEventListener('click', () => startRace((S.track + 1) % TRACKS.length));
$('rLobby').addEventListener('click', showLobby);
$('pResume').addEventListener('click', togglePause);
$('pRestart').addEventListener('click', () => startRace());
$('pLobby').addEventListener('click', showLobby);
$('bPause').addEventListener('click', () => { if (S.phase === 'race' || S.phase === 'count') togglePause(); });

// ---------- sound ----------
let soundOff = false;
function startAudio() {
  if (soundOff) return;
  if (!AU.ctx) { try { auInit(); } catch (e) { return; } }
  if (AU.ctx.state === 'suspended') AU.ctx.resume();
  if (!AU.on) { AU.on = true; AU.song = null; setSong(TRK ? TRK.look.song : 'arcade'); clearInterval(AU.timer); AU.timer = setInterval(schedule, 25); }
  $('bSound').textContent = 'Sound off';
}
function toggleSound() { if (AU.on) { soundOff = true; AU.on = false; clearInterval(AU.timer); if (AU.ctx) AU.ctx.suspend(); $('bSound').textContent = 'Sound on'; } else { soundOff = false; startAudio(); } }
$('bSound').addEventListener('click', toggleSound);
app.addEventListener('pointerdown', () => startAudio());

// ---------- main loop ----------
let last = performance.now(), hudT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!$('lobby').hidden) { pollLobbyPads(); animLobby(); }
  const n = Math.ceil(dt / (1 / 120)); for (let i = 0; i < n; i++) step(dt / n);
  render(paused ? 0 : dt);
  hudT -= dt; if (hudT <= 0) { hudT = 0.05; updHud(); drawMinimap(); }
  requestAnimationFrame(frame);
}
function boot() {
  for (let i = 0; i < TRACKS.length; i++) buildTrack(i);
  S.attractTrack = 0; setupAttract(); renderLobby();
  $('loading').hidden = true; requestAnimationFrame(frame);
}
(document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(() => setTimeout(boot, 30));
})();
</script>
